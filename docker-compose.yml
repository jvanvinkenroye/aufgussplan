services:
  aufgussplan:
    build: .
    container_name: aufgussplan
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - SCRAPE_ON_START=true
      # Uhrzeit für täglichen Scrape (Standard: 10:00)
      # - SCRAPE_HOUR=10
      # - SCRAPE_MINUTE=0
    volumes:
      # Datenbank persistent speichern
      - aufgussplan-data:/data
    # Healthcheck
    healthcheck:
      test: ["CMD", "aufgussplan", "--db-file", "/data/aufgussplan.db", "--db-stats"]
      interval: 1h
      timeout: 10s
      retries: 3

volumes:
  aufgussplan-data:
    name: aufgussplan-data
